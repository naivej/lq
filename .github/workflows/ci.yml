name: CI

on:
  push:
  pull_request:

# fmt is host-independent (Ubuntu only). Clippy lints the compiled crate, so
# Ubuntu (unix cfg) and Windows (windows cfg). Tests run on every shipping OS.
jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            fmt: true
            clippy: true
            components: rustfmt, clippy
          - os: windows-latest
            fmt: false
            clippy: true
            components: clippy
          - os: macos-latest
            fmt: false
            clippy: false
            components: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: ${{ matrix.components }}

      - name: Format
        if: ${{ matrix.fmt }}
        run: cargo fmt --check

      - name: Clippy
        if: ${{ matrix.clippy }}
        run: cargo clippy --all-targets -- --deny warnings

      - name: Test
        run: cargo test
